<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12110D" />

    <title>Austin Davis — Stories about remembering how to live.</title>
    <meta name="description" content="Reflections on life, family, time, and the things we don't understand until much later. Writing by Austin Davis." />
    <meta name="author" content="Austin Davis" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Austin Davis — Stories about remembering how to live." />
    <meta property="og:description" content="Reflections on life, family, time, and the things we don't understand until much later." />
    <meta property="og:image" content="/images/seasons/summer-1280.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Fonts are served from this origin (see src/styles/fonts.css). The two
         faces the hero needs are fetched in parallel with the app bundle. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/cormorant-garamond-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/cormorant-garamond-400-italic.woff2" />

    <link
      rel="preload"
      as="image"
      href="/images/seasons/summer-1280.webp"
      imagesrcset="/images/seasons/summer-880.webp 880w, /images/seasons/summer-1280.webp 1280w, /images/seasons/summer-1684.webp 1684w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Static form so Netlify's build-time crawler can detect it. Hidden from users. -->
    <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
