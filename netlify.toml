[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Every address the site answers on is a real file (scripts/prerender.js),
# so anything else is genuinely not here: the prerendered 404 page, with a
# 404 status, rather than the app shell pretending it was found.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Every response. The policy is exactly what the site needs and nothing more:
# its own scripts, its own fonts, its own images plus the generated textures
# (SVG data URIs in the stylesheet), inline style attributes (React writes
# the sheets' weathering and the reveals' delays inline), and the newsletter
# posting back to this origin for Netlify Forms. Nothing may frame it.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
